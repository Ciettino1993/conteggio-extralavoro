# Pubblica SpesaSmart su GitHub Pages e aggiorna ogni giorno i prezzi dei carburanti (open data MIMIT).
# Attivazione: vedi docs/pubblicazione.md (serve un account GitHub gratuito).
name: Pubblica

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 7 * * *' # ogni giorno dopo la pubblicazione dei dati MIMIT (ore 8 italiane)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Aggiorna prezzi carburanti
        run: npm run fuel:update
        continue-on-error: true # l'app viene pubblicata comunque (senza dati carburante se il download fallisce)
      - name: Diagnosi accesso MIMIT
        if: always()
        run: curl -sS -m 30 -o /dev/null -w "HTTP %{http_code} in %{time_total}s da IP $(curl -s -m 10 https://api.ipify.org)\n" https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv || true
      - name: Compila
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
